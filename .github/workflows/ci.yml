name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-hashed.txt
            requirements-dev.txt
            constraints-dev-hashed.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints-hashed.txt
          python -m pip install --require-hashes -r constraints-dev-hashed.txt

      - name: Audit pinned runtime dependency set
        # `make audit` runs pip-audit over requirements.txt + constraints.txt with
        # no --ignore-vuln exceptions (see Makefile).
        run: make audit

  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-hashed.txt
            requirements-dev.txt
            constraints-dev-hashed.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints-hashed.txt
          python -m pip install --require-hashes -r constraints-dev-hashed.txt

      - name: Run static checks (ruff — style, security, bugbear)
        # `make lint` bootstraps .venv-lint/ from the ruff pin in
        # requirements-dev.txt and runs ruff out of that venv. Going through the
        # Makefile rather than calling ruff directly means CI and a developer's
        # machine lint with the same binary on the same code path, so a change to
        # the lint target is exercised here before it reaches anyone locally.
        run: make lint

      - name: Compile Python files
        run: python -m compileall .

      - name: Type check with mypy (strict)
        run: python -m mypy --strict bot/ services/ adapters/ config/ models/ utils/ repositories/ db/ hy2_auth/ subscription_server/ warp/ main.py init_db.py

      - name: Run tests with coverage
        # Branch coverage comes from [tool.coverage.run] branch = true. -rs prints
        # why each skipped test was skipped, so a skip that hides a regression is
        # visible in the log instead of being one more "s".
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=71 -rs

      # Per-layer floors (ratchet). The TOTAL gate above can stay green while one
      # layer quietly loses its tests behind gains elsewhere; these read the same
      # .coverage file and fail on a per-layer drop. Each N is the layer's value as
      # measured by this job, minus 1 (CI run 42525873156: repositories 89%, warp
      # 90%, services 83%, adapters 77%). When a PR raises a layer, raise its N to
      # the new CI value minus 1; never lower one to get green. Keep
      # COVERAGE_FLOORS in the Makefile in step with these.
      - name: Coverage floor — repositories (>= 88%)
        run: python -m coverage report --include='repositories/*' --fail-under=88

      - name: Coverage floor — warp (>= 89%)
        run: python -m coverage report --include='warp/*' --fail-under=89

      - name: Coverage floor — services (>= 82%)
        run: python -m coverage report --include='services/*' --fail-under=82

      - name: Coverage floor — adapters (>= 76%)
        run: python -m coverage report --include='adapters/*' --fail-under=76

  tests-host-like:
    # Reproduces the environment in which scripts/deploy.sh Phase 1 runs pytest on
    # the real host: the AmneziaWG tunnel (out-warp) and client (awg0) netdevs
    # EXIST there, so the warp helpers' /sys/class/net/<iface>/statistics
    # fast-paths are live. Plain CI has no such interfaces, so those branches never
    # execute and host-only leaks (e.g. the counter-based self-check reading the
    # live-but-flat /sys and ignoring the test's injected growth) pass in CI yet
    # fail on the host at deploy time. This job materialises the interfaces so the
    # same /sys branches run in CI as on the host, turning that whole class of
    # host-leak regressions into a PRE-MERGE gate instead of a Phase 1 surprise.
    name: Tests (host-like — deploy Phase 1 env)
    runs-on: ubuntu-latest
    needs: [dependency-audit]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-hashed.txt
            requirements-dev.txt
            constraints-dev-hashed.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r constraints-hashed.txt
          python -m pip install --require-hashes -r constraints-dev-hashed.txt

      - name: Materialise the tunnel/client interfaces (reproduce the deploy host)
        # dummy netdevs give the helpers a live /sys/class/net/<iface>/statistics
        # (flat counters, exactly like an idle tunnel on the host). No traffic is
        # needed — presence of the /sys tree is what flips the helper onto its
        # host-only code path.
        run: |
          sudo ip link add out-warp type dummy
          sudo ip link add awg0 type dummy
          sudo ip link set out-warp up
          sudo ip link set awg0 up
          test -r /sys/class/net/out-warp/statistics/rx_bytes
          test -r /sys/class/net/awg0/statistics/rx_bytes

      - name: Run tests (mirror deploy Phase 1 — deterministic, no pytest cache)
        # Same invocation as scripts/deploy.sh Phase 1 (`-p no:cacheprovider`, no
        # xdist, no randomly) so CI reproduces that gate 1:1 — now WITH the tunnel
        # interfaces present. If either determinism plugin is ever added it must go
        # to deploy.sh, the `tests` job AND here, or the three stop reproducing.
        run: python -m pytest -q -p no:cacheprovider

  installer-e2e:
    # scripts/install.sh end to end on a REAL VM: ubuntu-24.04 with systemd as
    # PID 1 and root via sudo — exactly what the installer refuses to run without.
    # The Bot API is tests/e2e/mock_telegram_api.py (installer and bot both reach
    # it through TELEGRAM_API_BASE); the code installed is THIS checkout. Every
    # phase is a hard assertion in tests/e2e/run_install_e2e.sh: relay mode
    # changes nothing; a failure injected after the bot started rolls back every
    # manifest path; a real install is active with NRestarts=0 and the readiness
    # marker; /start claim_<code> makes the operator superadmin and a second claim
    # is refused; a re-run is a repair that leaves .env and vpn.db byte-identical.
    name: Installer end-to-end (ubuntu-24.04, systemd, mock Bot API)
    runs-on: ubuntu-24.04
    needs: [dependency-audit]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The installer clones this checkout (file://); full history and a
          # branch at HEAD make the commit under test fetchable by its SHA.
          fetch-depth: 0

      - name: Set up Python (for the mock Bot API only)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-hashed.txt

      - name: Install the mock's dependencies (hash-pinned)
        run: python -m pip install --require-hashes -r constraints-hashed.txt

      - name: Put the commit under test on a branch
        run: git branch -f e2e-under-test HEAD

      - name: Run scripts/install.sh end to end
        run: sudo MOCK_PYTHON="$(command -v python)" bash tests/e2e/run_install_e2e.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status vpn-bot.service --no-pager || true
          sudo journalctl -u vpn-bot.service -n 200 --no-pager || true
          sudo tail -n 200 /opt/vpn-service/logs/bot.log || true
          for f in /var/log/vpn-bot-install.*; do echo "== $f"; sudo cat "$f"; done || true

  relay-installer-e2e:
    # scripts/install.sh in RELAY mode end to end on a REAL ubuntu-24.04 VM (systemd,
    # nftables, sshd): a hand-made relay (/etc/vpn-relay.nft + vpn-relay.service +
    # table ip vpnrelay) is created first; a failure injected after the relay started
    # must put it back exactly (live table, files, unit, authorized_keys, ip_forward);
    # the real install must ADOPT it with exactly one DNAT per port and keep the old
    # one in /var/backups/vpn-relay; then the agent is driven over a real ssh with
    # the bot's key (whitelist, injections, hello/status/apply), the resolve timer
    # follows a changed name, and uninstall removes everything. No Telegram: a relay
    # never talks to the Bot API. Every phase is a hard assertion in
    # tests/e2e/run_relay_install_e2e.sh.
    name: Relay installer end-to-end (ubuntu-24.04, systemd, nftables, sshd)
    runs-on: ubuntu-24.04
    needs: [dependency-audit]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The installer clones this checkout (file://) and checks out the commit
          # under test by its SHA.
          fetch-depth: 0

      - name: Put the commit under test on a branch
        run: git branch -f e2e-under-test HEAD

      - name: Run scripts/install.sh --relay end to end
        run: sudo bash tests/e2e/run_relay_install_e2e.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo nft list ruleset || true
          sudo systemctl status vpn-relay.service vpn-relay-resolve.timer --no-pager || true
          sudo journalctl -u vpn-relay.service -u vpn-relay-resolve.service -t vpn-relay-agent -n 200 --no-pager || true
          for f in /var/log/vpn-bot-install.*; do echo "== $f"; sudo cat "$f"; done || true
