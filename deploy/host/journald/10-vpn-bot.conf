# managed by scripts/deploy.sh from deploy/host/journald/10-vpn-bot.conf — do not edit on the host
#
# Caps the persistent journal. This used to be a hand edit of /etc/systemd/journald.conf
# itself, which is a dpkg conffile: the next systemd upgrade asks about it (or keeps a
# .dpkg-dist next to it) and the setting is one wrong answer away from being lost.
# A drop-in merges over the stock file, so the conffile can go back to the package
# default: deploy.sh restores it (MANAGED_HOST_FILES, class pristine) once Phase 1 has
# proven that nothing effective changes.
[Journal]
SystemMaxUse=500M
