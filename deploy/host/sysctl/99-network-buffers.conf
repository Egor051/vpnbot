
# Максимальные размеры буферов приема и отправки для всех сокетов
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Размеры буферов по умолчанию
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Буферы TCP (минимум, по умолчанию, максимум)
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# Увеличение очереди пакетов на сетевом интерфейсе
net.core.netdev_max_backlog = 5000

# Увеличение очереди на прием входящих соединений
net.core.somaxconn = 4096

vm.dirty_background_ratio = 10
vm.dirty_ratio = 30
