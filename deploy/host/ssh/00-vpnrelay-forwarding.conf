# Repo-managed (scripts/deploy.sh MANAGED_HOST_FILES, role relay).
# Forwarding on a relay is LOCAL only. The hub forwards the bot's jump key to the
# relays behind it (ssh -W, limited by the key's permitopen — docs/relay.md,
# "Managing the RU relays through the hub"); nothing may open a listener here,
# neither a TCP port nor a Unix socket (ssh -R). No authorized_keys option forbids
# that: permitlisten does not cover Unix sockets and accepts no "none".
# vpn-relay-agent refuses `jump` until sshd -T shows these values.
AllowTcpForwarding local
AllowStreamLocalForwarding local
