# Rendered by scripts/deploy.sh from SSH_PORT in /opt/vpn-service/.env (template:
# deploy/host/ssh/00-vpn-bot-port.conf in the repo, docs/host-state.md#the-ssh-port).
# Port: ssh.service started WITHOUT ssh.socket (the fallback path) listens where the
# socket does. During a port migration both ports are listed. LogLevel VERBOSE:
# sshd logs "Connection from ... on <addr> port <port>" only at VERBOSE — the proof
# that the new port is reachable from outside.
Port @SSH_PORT@
LogLevel VERBOSE
