# managed by scripts/deploy.sh from deploy/host/resolved/10-vpn-bot.conf — do not edit on the host
#
# The upstream DNS of systemd-resolved. It used to live only in a hand edit of
# /etc/systemd/resolved.conf, a dpkg conffile; a drop-in merges over the stock file,
# so the conffile can go back to the package default. On the main server
# /etc/resolv.conf is a plain file (deploy/host/dns/resolv.conf), not resolved's stub
# symlink — see docs/host-state.md, "DNS on the main server".
[Resolve]
DNS=1.1.1.1 8.8.8.8
FallbackDNS=1.0.0.1 8.8.4.4
