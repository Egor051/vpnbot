# managed by vpn-bot-protocol-install (deploy/nginx/selfsteal.conf) — do not edit on the host
#
# The REALITY self-steal target: Xray's vless-in forwards every TLS client that is not
# one of its own (a probe, a scanner) to realitySettings.target = 127.0.0.1:8443, and
# this vhost answers it as the real site of @DOMAIN@ — the domain's own certificate
# (laid out by vpn-bot-cert, docs/certificate.md), TLS 1.3, h2, a static page.
# Loopback only: the public :443 is Xray's.
#
# `listen ... ssl http2`, not `http2 on;`: Ubuntu 24.04 ships nginx 1.24, and the
# `http2` directive exists only from 1.25.1.
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name @DOMAIN@;

    ssl_certificate     /etc/vpn-bot/tls/fullchain.pem;
    ssl_certificate_key /etc/vpn-bot/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vpnbot_selfsteal:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root @SITE_ROOT@;
    index index.html;
    access_log off;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
