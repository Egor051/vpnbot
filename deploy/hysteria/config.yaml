# hysteria-server config.yaml — source of truth for the Hysteria2 data plane.
#
# Plain QUIC on UDP/443 (no salamander obfuscation, no in-process ACME).
# Coexists with Xray REALITY on TCP/443: different transport (UDP vs TCP), same
# port number is fine.
#
# tls.cert/tls.key point at a valid Let's Encrypt cert for the server's domain,
# issued and renewed by acme.sh (dns_duckdns) outside this repo. `acme.sh
# --install-cert` writes to these same paths and its reloadcmd restarts
# hysteria-server, so the process always picks up the current cert/key.
#
# !!! DO NOT `cp` THIS FILE TO /etc/hysteria/config.yaml DIRECTLY !!!
# The secret below is a PLACEHOLDER. A bare cp overwrites the live
# trafficStats secret with it, and hysteria-server starts rejecting the bot's
# stats/online/kick calls with 401 (stats/online/kick break silently — the
# data plane itself still starts fine). Always install through:
#
#   sudo bash deploy/hysteria/install-config.sh
#   # copies this file AND injects the real secret from HYSTERIA2_STATS_SECRET
#   # in .env, so the placeholder below never reaches disk
#   bash deploy/hysteria/preflight-udp443.sh   # must exit 0 before (re)starting
#   sudo systemctl restart hysteria-server
#
# HYSTERIA2_PORT in .env must match `listen` below (the bot only builds client
# links from HYSTERIA2_PORT; it does not template or apply this file).

listen: :443

# Per-client rate ceiling for Hysteria2's Brutal congestion controller.
#
# Brutal only engages when a bandwidth value is in play; with no value on either
# side the connection falls back to the BBR controller, which backs off on loss.
# Brutal does NOT measure the path — it sends at the rate it was told and holds
# that rate through loss — so without a ceiling a client that declares a fantasy
# figure (v2rayN / NekoBox / Happ all expose these fields) makes this 1-vCPU box
# try to sustain it, at every other client's expense. That is what these values
# cap. They do not stop anyone from using Brutal; they bound it.
#
# Semantics, per the Hysteria 2 docs (Full Server Config / Full Client Config):
#   - Server-side values are a limit PER CLIENT, not a total shaper for the host:
#     each client is held to this rate, they do not share it.
#   - The server's `up` is the client's DOWNLOAD ceiling; the server's `down` is
#     the client's UPLOAD ceiling (the server's upload is the client's download).
#   - The effective rate in each direction is min(client value, server value).
#   - Zero, or the value omitted, means "no limit" for that direction — on either
#     side. This block existing is the whole point: an absent one is not a
#     conservative default, it is no ceiling at all.
#   - `ignoreClientBandwidth: true` is the mutually exclusive alternative: it
#     discards the client's declared bandwidth outright and forces the non-Brutal
#     controller, which makes the values below dead weight. It is deliberately
#     NOT set here — the goal is to cap Brutal, not to disable it.
#
# Format is the docs' own literal (`bps`/`kbps`/`mbps`/`gbps`/`tbps`).
# Like every other key in this file, a change here only takes effect on the next
# `systemctl restart hysteria-server`.
bandwidth:
  up: 95 mbps
  down: 95 mbps

tls:
  # Paths are host-local; the cert/key files themselves are never committed to
  # git. Populated/refreshed by acme.sh --install-cert (see header above).
  cert: /etc/hysteria/cert.pem
  key: /etc/hysteria/key.pem

# HTTP auth against vpn.db via the separate hy2_auth endpoint (deploy/vpn-bot-hy2-auth.service).
# url host:port must match HYSTERIA2_AUTH_LISTEN in .env.
auth:
  type: http
  http:
    url: http://127.0.0.1:8444/auth

# Per-key traffic counters, online-clients count and revoke-kick. listen must
# match HYSTERIA2_STATS_LISTEN (loopback only — never expose to the internet);
# secret must match HYSTERIA2_STATS_SECRET.
trafficStats:
  listen: 127.0.0.1:9999
  secret: "<random-secret>"  # placeholder; filled in by install-config.sh — never edit/deploy by hand

# Masquerade: probed over the hysteria QUIC/UDP listener itself (a client that
# doesn't complete the Hysteria2 handshake gets served this decoy instead of a
# reset). This is NOT listenHTTP/listenHTTPS — those open separate plaintext
# TCP :80/:443 listeners, and TCP/443 on this host is already held by Xray
# REALITY; adding them would collide. Only the file dir below is needed for a
# static-site decoy on the existing UDP/443 path.
#
# /etc/hysteria/masq is populated by hand on the host (outside this repo),
# same as tls.cert/tls.key above — install-config.sh does not manage it.
masquerade:
  type: file
  file:
    dir: /etc/hysteria/masq
