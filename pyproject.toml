[project]
name = "vpnbot"
requires-python = ">=3.12,<3.13"
version = "2.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Per-test wall-clock ceiling (pytest-timeout). This is a BACKSTOP, not a fix for
# anything: a test that hits it is reporting a hang, and the hang is the bug.
# It exists because deploy.sh runs this suite as a Phase 1 gate on the production
# host, where one wedged test does not fail — it holds the whole gate open and
# blocks the deploy it was supposed to protect (a `journalctl` read with no `-n`
# did exactly that). A bounded FAILED is diagnosable; an open-ended hang is not.
#
# 120s is ~4x the slowest legitimate test (the ~30s dead-port poll in
# test_subscription_server.py) — wide enough that a slow runner never trips it.
# Suites that shell out to deploy.sh set a much tighter per-module limit of their
# own, since a healthy run there is milliseconds.
#
# `signal` (SIGALRM in the main thread) fails the one offending test and lets the
# run continue; the `thread` method would kill the whole pytest process instead,
# which is the outcome this is meant to avoid.
timeout = 120
timeout_method = "signal"

[tool.coverage.run]
branch = true
omit = ["tests/*", "init_db.py", "main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "aiosqlite.*",
    "aiohttp.*",
    "magic_filter.*",
]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "S", "B", "RUF"]
preview = true
ignore = [
    "E241",   # multiple spaces after comma — formatting; dedicate a separate formatting PR
    "E501",   # line too long — dedicate a separate formatting PR
    "RUF001", # ambiguous unicode character — project intentionally uses Cyrillic strings
    "RUF029", # async without await — framework handlers must be async even without internal awaits
    "RUF067", # __init__ module logic — i18n design intentional
    "S101",   # assert used in tests and internal invariants

    # New in ruff 0.16 and preview-only. Both ask for a mechanical, repo-wide
    # rewrite of suppression syntax with no behavioural effect — `# noqa: X` and
    # rule codes in the selectors below are still honoured, just no longer the
    # style ruff prefers. Migrating them is a separate PR (and one that would pin
    # the repo to ruff >= 0.16, since older ruff does not parse `ruff: ignore`).
    "RUF105", # `noqa` comment used instead of `ruff: ignore`
    "RUF201", # rule code used instead of name in a lint selector
]

# The subprocess (S404/S603/S607) and SQL (S608) suppressions below are scoped to
# the directories that legitimately need them, so the rules still guard the rest of
# the tree (bot/, services/, config/, etc.) against new violations.
[tool.ruff.lint.per-file-ignores]
# f-string SQL in the data-access layer uses only internal column/table constants,
# never user input. Parameterised values always go through placeholders.
"db/*" = ["S608"]
"repositories/*" = ["S608"]
# The non-root deploy preflight shells out to controlled, fixed system tools.
"deploy/*" = ["S404", "S603", "S607"]
# Tests: hardcoded test secrets/paths, subprocess for helper tests (running the
# WARP routes helper against mocked ip/awg/iptables), and pytest-style idioms.
"tests/*" = ["S105", "S106", "S108", "S404", "S603", "S607", "F401", "B009", "B010", "RUF043", "RUF015", "RUF100", "E303", "E306", "E402"]
